# 平台自带的运行编排：MySQL + pgvector + agent-platform
# 用法：docker compose up -d --build
#   本地 IDE 跑应用时只需中间件：docker compose up -d mysql pgvector
# 应用镜像由本目录 Dockerfile 多阶段构建（自带 jar），无需宿主机先 mvn package
services:
  mysql:
    # 显式定名，否则默认是 <目录名>-<服务名>-<序号>（这里会叠成 agent-platform-mysql-1）
    container_name: agent-platform-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agent_platform
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 知识库向量存储。业务数据在 MySQL，向量在 Postgres，两边互不迁移（docs/KNOWLEDGE-RAG.md §6）
  pgvector:
    container_name: agent-platform-pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 30

  agent-platform:
    container_name: agent-platform-app
    build: .
    ports:
      - "8000:8000"
    extra_hosts:
      # 让容器能经宿主机访问兄弟仓库发布出来的业务系统端口（Linux 需显式声明，Windows 自带）
      - "host.docker.internal:host-gateway"
    volumes:
      # 制度文档挂载在镜像外：改文档后重启容器或调用 reindex 即生效，不必重建镜像
      - ./knowledge:/app/knowledge:ro
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      # 从本目录 .env 读（已 gitignore）；照 .env.example 复制一份
      LLM_API_KEY: ${LLM_API_KEY:-missing-key}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      # 知识库：EMBEDDING_API_KEY 为空时整个模块不装配（平台仍可正常运行）
      KNOWLEDGE_DB_URL: "jdbc:postgresql://pgvector:5432/knowledge"
      KNOWLEDGE_DB_USERNAME: postgres
      KNOWLEDGE_DB_PASSWORD: postgres
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn}
      # 业务系统跑在隔壁 business-systems 栈里，与本栈不在一个 docker 网络，故经宿主机发布端口访问
      GATEWAY_BACKEND_HOST: host.docker.internal
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy

volumes:
  mysql-data:
  pgvector-data:
