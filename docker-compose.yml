# 平台自带的运行编排：MySQL + agent-platform
# 用法：docker compose up -d --build
#   本地 IDE 跑应用时只需中间件：docker compose up -d mysql
# 应用镜像由本目录 Dockerfile 多阶段构建（自带 jar），无需宿主机先 mvn package
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agent_platform
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  agent-platform:
    build: .
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      # 从本目录 .env 读（已 gitignore）；照 .env.example 复制一份
      LLM_API_KEY: ${LLM_API_KEY:-missing-key}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
