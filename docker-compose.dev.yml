# 开发环境中间件（平台专属容器，与宿主机 MySQL80/Redis 6379 完全隔离）
# 用法：docker compose -f docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: agent-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agent_platform
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # meeting-booking 业务库初始化（仅首次空数据目录时执行）
      - ../meeting-booking/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: agent-platform-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
