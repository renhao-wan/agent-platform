# 开发环境中间件（与宿主机 MySQL/Redis 实例完全隔离，自带建库脚本，不依赖其他仓库路径）
# 用法：docker compose -f docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: agent-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agent_platform
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 建库脚本随本仓库分发（不依赖其他仓库路径）；仅在数据卷首次创建时执行
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: agent-platform-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
