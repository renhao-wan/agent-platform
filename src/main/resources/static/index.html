<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助手 · 会议预约</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg:#0b0f14; --panel:#141a22; --panel2:#1a222d; --line:#263140;
    --text:#e8ecf2; --muted:#7d8b9e; --accent:#4f8ef7; --ok:#34c98e;
    --warn:#e8b64c; --err:#e06c6c; --user:#2b4c8c;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font:14px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; display:flex; flex-direction:column; }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header b { font-size:16px; }
  header span { color:var(--muted); font-size:12px; }
  #who { margin-left:auto; color:var(--muted); font-size:12px; }
  #who a { color:var(--accent); cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; max-width:820px; width:fit-content; min-width:280px; }
  .card .head { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .card .head .ico { font-size:14px; }
  .card.user { background:var(--user); border-color:transparent; align-self:flex-end; }
  .card.answer { border-color:var(--ok); }
  .card.answer .body { line-height:1.75; }
  .card.answer .body p { margin:6px 0; }
  .card.answer .body ul { margin:6px 0 6px 18px; }
  .card.answer .body code { background:#0d1420; padding:2px 6px; border-radius:4px; font-family:Consolas,monospace; font-size:13px; }
  .card.answer .body pre { background:#0d1420; padding:10px; border-radius:8px; overflow-x:auto; margin:8px 0; }
  .card.answer .body pre code { background:none; padding:0; }
  .card.error { border-color:var(--err); }
  .card .tool-args { color:var(--muted); font-family:Consolas,monospace; font-size:12px; word-break:break-all; }
  .thinking { display:flex; align-items:center; gap:8px; color:var(--muted); padding:4px 22px 10px; font-size:13px; }
  .thinking .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1.2s infinite; }
  .thinking .dot:nth-child(2){ animation-delay:.2s } .thinking .dot:nth-child(3){ animation-delay:.4s }
  @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:1} }
  #login-section { max-width:380px; margin:60px auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px; }
  #login-section h2 { font-size:15px; margin-bottom:6px; }
  #login-section .hint { color:var(--muted); font-size:12px; margin-bottom:14px; }
  #login-section input { width:100%; padding:10px 12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); }
  #login-section button { width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; font-size:14px; }
  #login-err { color:var(--err); font-size:12px; min-height:16px; margin-bottom:6px; }
  #confirm-bar { display:flex; align-items:center; gap:12px; padding:12px 22px; background:#2b2416; border-top:1px solid var(--warn); }
  #confirm-bar[hidden] { display:none; }
  #confirm-text { flex:1; color:var(--warn); }
  #confirm-bar button { padding:7px 20px; border:0; border-radius:8px; cursor:pointer; font-weight:600; }
  #btn-ok { background:var(--ok); color:#06281c; }
  #btn-no { background:#4a4f57; color:#fff; }
  form { display:flex; gap:10px; padding:14px 22px 18px; border-top:1px solid var(--line); }
  input#message { flex:1; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14px; outline:none; }
  input#message:focus { border-color:var(--accent); }
  button.send { padding:12px 26px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.send:disabled { opacity:.45; cursor:not-allowed; }
  .cursor { display:inline-block; width:8px; height:16px; background:var(--text); animation:blink .9s infinite; vertical-align:-2px; }
  @keyframes blink { 50%{opacity:0} }
</style>
</head>
<body>
<header><b>AI 助手 · 会议预约</b><span>ReAct 运行时 + OpenAPI 工具接入</span><span id="who"></span></header>

<div id="login-section">
  <h2>登录</h2>
  <div class="hint">企业统一账号（演示种子：admin/admin123 · staff01/staff123）</div>
  <div id="login-err"></div>
  <input id="login-user" placeholder="用户名" autocomplete="username">
  <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
  <button onclick="login()">登录</button>
</div>

<div id="log" hidden>
  <div class="card">
    <div class="body">
      👋 我是会议预约助手。试试：
      <ul>
        <li>“帮我看看明天下午有哪些会议室可用，然后直接帮我预订容量最小的那间”</li>
        <li>“取消我最近的一个预订”</li>
      </ul>
    </div>
  </div>
</div>
<div class="thinking" id="thinking" hidden>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div> AI 正在思考与执行…
</div>
<div id="confirm-bar" hidden>
  <span id="confirm-text"></span>
  <button id="btn-ok" onclick="confirmAction(true)">✓ 同意执行</button>
  <button id="btn-no" onclick="confirmAction(false)">✕ 拒绝</button>
</div>
<form id="chat-form" hidden>
  <input id="message" placeholder="输入你的需求…" autocomplete="off">
  <button class="send" id="send" type="submit">发送</button>
</form>

<script>
const $ = id => document.getElementById(id);
const logEl = $("log");
let sessionKey = localStorage.getItem("sessionKey") || null;
let token = localStorage.getItem("token") || null;
let myName = localStorage.getItem("myName") || "";
let pendingToken = null;
let busy = false;

function authHeaders(extra) {
  const h = Object.assign({ "Content-Type": "application/json" }, extra || {});
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}
function showLogin() {
  $("login-section").hidden = false;
  $("log").hidden = true; $("chat-form").hidden = true;
  $("thinking").hidden = true; $("confirm-bar").hidden = true;
  $("who").textContent = "";
}
function showChat() {
  $("login-section").hidden = true;
  $("log").hidden = false; $("chat-form").hidden = false;
  $("who").innerHTML = myName + ' · <a onclick="logout()">退出</a>';
}
function logout() {
  token = null; sessionKey = null; myName = "";
  localStorage.removeItem("token"); localStorage.removeItem("sessionKey"); localStorage.removeItem("myName");
  location.reload();
}
async function login() {
  const username = $("login-user").value.trim(), password = $("login-pass").value;
  $("login-err").textContent = "";
  try {
    const resp = await fetch("/api/v1/auth/login", { method:"POST",
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
    if (!resp.ok) {
      const j = await resp.json().catch(() => ({}));
      $("login-err").textContent = (j.message || ("登录失败 " + resp.status));
      return;
    }
    const j = await resp.json();
    token = j.token; myName = username;
    localStorage.setItem("token", token); localStorage.setItem("myName", myName);
    showChat();
    logEl.innerHTML = "";
  } catch (e) {
    $("login-err").textContent = "网络异常：" + e.message;
  }
}

const ICONS = { user:"🧑", plan:"🗺️", tool_call:"🔧", tool_result:"📦",
  confirm_request:"⚠️", answer:"🤖", error:"❌", done:"✅" };
const LABELS = { user:"你", plan:"执行计划", tool_call:"调用工具", tool_result:"工具结果",
  confirm_request:"需要确认", answer:"AI 助手", error:"出错了", done:"完成" };

function card(type) {
  const div = document.createElement("div");
  div.className = "card " + type;
  const ico = ICONS[type] || "•";
  div.innerHTML = '<div class="head"><span class="ico">'+ico+'</span>'+(LABELS[type]||type)+'</div><div class="body"></div>';
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div.querySelector(".body");
}
function addText(type, text) { card(type).textContent = text; }
function renderMarkdown(el, md) {
  if (window.marked) { el.innerHTML = marked.parse(md); } else { el.textContent = md; }
}
function typewriter(el, md) {
  const plain = md.replace(/[#*`>]/g, m => m === "\n" ? "\n" : m);
  let i = 0;
  const timer = setInterval(() => {
    i = Math.min(i + 3, plain.length);
    el.textContent = plain.slice(0, i);
    logEl.scrollTop = logEl.scrollHeight;
    if (i >= plain.length) { clearInterval(timer); renderMarkdown(el, md); }
  }, 18);
}
function showThinking(on) { $("thinking").hidden = !on; }

function handle(event, data) {
  switch (event) {
    case "session":
      sessionKey = data.sessionKey;
      localStorage.setItem("sessionKey", sessionKey);
      break;
    case "plan":
      addText("plan", "执行计划：" + (data.steps || []).join(" → "));
      showThinking(true);
      break;
    case "tool_call": {
      showThinking(false);
      const el = card("tool_call");
      el.innerHTML = '<div class="tool-args">🔧 ' + data.tool + '(' + (data.arguments||"{}") + ')</div>';
      logEl.scrollTop = logEl.scrollHeight;
      break;
    }
    case "tool_result": {
      let summary = data.summary || "";
      try { const j = JSON.parse(summary);
        if (j.data && Array.isArray(j.data)) summary = "返回 " + j.data.length + " 条结果";
      } catch(e){}
      addText("tool_result", data.tool + " → " + summary);
      showThinking(true);
      break;
    }
    case "confirm_request":
      showThinking(false);
      pendingToken = data.confirmToken;
      $("confirm-text").textContent = data.message;
      $("confirm-bar").hidden = false;
      addText("confirm_request", data.message);
      break;
    case "answer":
      showThinking(false);
      typewriter(card("answer"), data.content);
      logEl.scrollTop = logEl.scrollHeight;
      break;
    case "error":
      showThinking(false);
      addText("error", data.message);
      break;
    case "done":
      showThinking(false);
      addText("done", "本轮完成");
      break;
    case "unauthorized":
      token = null; localStorage.removeItem("token");
      showLogin();
      $("login-err").textContent = "登录已过期，请重新登录";
      break;
  }
}

async function confirmAction(approved) {
  if (!pendingToken) return;
  const t = pendingToken; pendingToken = null;
  $("confirm-bar").hidden = true;
  addText("user", approved ? "✓ 同意执行" : "✕ 已拒绝");
  const resp = await fetch("/api/v1/confirm", { method:"POST",
    headers: authHeaders(), body: JSON.stringify({ confirmToken: t, approved }) });
  if (resp.status === 401) { token = null; showLogin(); }
}

$("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) return;
  const input = $("message");
  const message = input.value.trim();
  if (!message) return;
  input.value = ""; busy = true; $("send").disabled = true;
  addText("user", message);
  showThinking(true);

  try {
    const resp = await fetch("/api/v1/chat", { method:"POST", headers: authHeaders(),
      body: JSON.stringify({ sessionKey, message }) });
    if (resp.status === 401) {
      token = null; localStorage.removeItem("token");
      showLogin(); $("login-err").textContent = "登录已过期，请重新登录";
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream:true });
      const blocks = buffer.split("\n\n"); buffer = blocks.pop();
      for (const block of blocks) {
        let event = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (data) { try { handle(event, JSON.parse(data)); } catch(e){} }
      }
    }
  } catch (err) {
    showThinking(false);
    addText("error", "连接异常：" + err.message);
  } finally {
    busy = false; $("send").disabled = false;
  }
});

// 启动：有 token 直接进聊天，否则显示登录
if (token) { showChat(); } else { showLogin(); }
</script>
</body>
</html>
