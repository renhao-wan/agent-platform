server:
  port: 8000

spring:
  application:
    name: agent-platform
  ai:
    openai:
      # 默认指向 DeepSeek 的 OpenAI 兼容端点（/v1 与不带 /v1 的路径均可用）。
      # 换供应商只改这三个变量；换到路径不合 OpenAI 约定的服务时，另需设
      # spring.ai.openai.chat.completions-path 覆盖默认的 /v1/chat/completions。
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:missing-key}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-flash}
          temperature: 0.2
  datasource:
    url: jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always   # schema.sql 使用 IF NOT EXISTS，启动时幂等建表

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

platform:
  gateway:
    forward:
      # 转发到业务系统的超时（毫秒）；测试用极短值验证超时路径
      connect-timeout-ms: 2000
      read-timeout-ms: 10000
  agent:
    gateway-id: ${AGENT_GATEWAY_ID:gw1}
    max-steps: 8
    context-threshold: 6000
    confirm-timeout-seconds: 300
    # 工具路由责任链（ADR-004）：节点按 routing-handlers 顺序逐环尝试，弃权/异常传下一环，链尾兜底全量直通。
    # 触发阈值：工具数达到 routing-tool-count-threshold 才启用路由——当前个位数工具规模下整链休眠，
    # 对主流程零开销；工具规模化后自动武装，无需改代码。本地想提前体验把阈值调到 4 以下即可。
    routing-handlers: wattai   # 逗号分隔按序尝试；当前支持 wattai（jev/本地语义路由为预留扩展位）；置空 = 不路由
    routing-tool-count-threshold: 20
