server:
  port: 8000
  # 滚动发布/停机时不立刻掐断在途请求（含正在收尾的对话）；SSE 仍受下面 30 秒上限约束。
  shutdown: graceful

spring:
  application:
    name: agent-platform
  lifecycle:
    timeout-per-shutdown-phase: 30s
  ai:
    model:
      # embedding 不走 spring.ai.openai（那是 DeepSeek 的聊天端点，没有 embeddings 接口）：
      # 知识库的向量模型由 KnowledgeConfig 单独构造，指向 SiliconFlow。
      embedding: none
    openai:
      # 默认指向 DeepSeek 的 OpenAI 兼容端点（/v1 与不带 /v1 的路径均可用）。
      # 换供应商只改这三个变量；换到路径不合 OpenAI 约定的服务时，另需设
      # spring.ai.openai.chat.completions-path 覆盖默认的 /v1/chat/completions。
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:missing-key}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-flash}
          temperature: 0.2
  datasource:
    url: jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always   # schema.sql 使用 IF NOT EXISTS，启动时幂等建表

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

platform:
  gateway:
    forward:
      # 转发到业务系统的超时（毫秒）；测试用极短值验证超时路径
      connect-timeout-ms: 2000
      read-timeout-ms: 10000
    # 契约对账（决策 08）：启动时全量对账一次；之后按间隔重新拉取契约，
    # 接口新增/修改/删除都会收敛，不必重启平台。sync-enabled 置 false 可只保留启动对账；
    # sync-on-startup 置 false 则只靠定时任务与手工触发（启动早于业务系统时用）。
    sync-enabled: ${GATEWAY_SYNC_ENABLED:true}
    sync-on-startup: ${GATEWAY_SYNC_ON_STARTUP:true}
    # 启动时把配置里的来源种进注册表（只读写库，不访问业务系统）；测试环境可关闭
    seed-on-startup: ${GATEWAY_SEED_ON_STARTUP:true}
    sync-interval-ms: ${GATEWAY_SYNC_INTERVAL_MS:300000}
    # 契约来源种子：启动时写入 tool_source（已存在则不重复插入），之后平台从数据库读取来源清单。
    # 每项是业务系统暴露 OpenAPI 契约的地址（统一为 /v3/api-docs，WireMock 模拟的两个系统也用
    # 一条映射把自己的契约挂在同一路径上）。契约可访问就等于工具可用，不必手工导入；改了业务
    # 系统的 @Operation 说明或 x-required-permission 声明，下一次对账即生效（默认 5 分钟，也可
    # POST /admin/sources/sync 立即触发）。
    #
    # id 是对账的归属键，必填且稳定唯一：同一来源在容器内外只是 host 不同，不能因此算成两份契约。
    # 每次启动按本列表种子/刷新 CONFIG 来源；从本列表移除即软下线（工具 present=0，保留行）。
    # 管理员可在运行时用 POST/PUT/DELETE /admin/sources 管理来源，编辑过的来源归管理端所有，
    # 配置不再覆盖它；工具定义本身永远由契约推导，管理端只读（只能启停）。
    #
    # GATEWAY_BACKEND_HOST 是唯一的拓扑开关：平台跑在容器里时由 docker-compose 覆盖成
    # host.docker.internal——两个仓库各自一份 compose、各占一个 docker 网络，容器解析不到
    # 兄弟栈的服务名，只能经宿主机发布端口过去。
    # 列表留空 = 配置来源全部视为已移除（软下线）；ADMIN 来源不受影响，仍参与对账。
    sources:
      - id: booking
        url: http://${GATEWAY_BACKEND_HOST:localhost}:8090/v3/api-docs
        service-key-name: X-Service-Key
        service-key-value: ${BOOKING_SERVICE_KEY:booking-service-key}
      - id: expense
        url: http://${GATEWAY_BACKEND_HOST:localhost}:8091/v3/api-docs
        service-key-name: X-Service-Key
        service-key-value: ${STUB_SERVICE_KEY:stub-service-key}
      - id: repair
        url: http://${GATEWAY_BACKEND_HOST:localhost}:8092/v3/api-docs
        service-key-name: X-Service-Key
        service-key-value: ${STUB_SERVICE_KEY:stub-service-key}
  agent:
    gateway-id: ${AGENT_GATEWAY_ID:gw1}
    max-steps: 8
    context-threshold: 6000
    confirm-timeout-seconds: 300
    # SSE 空闲保活：确认等待最长 300 秒、模型单次生成最长 120 秒，期间无业务事件；
    # 不发 comment 时反向代理的 idle timeout（常见 60 秒）会断开连接。0 关闭。
    sse-heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:15000}
    # 大模型 HTTP 超时：供应商挂起时快速失败，避免 loop 线程无限期占用。
    # 读超时覆盖一次完整生成，长回答场景不要调得过小。
    llm-connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:5000}
    llm-read-timeout-ms: ${LLM_READ_TIMEOUT_MS:120000}
    # 工具路由责任链（决策 04）：节点按 routing-handlers 顺序逐环尝试，弃权/异常传下一环，链尾兜底全量直通。
    # 触发阈值：工具数达到 routing-tool-count-threshold 才启用路由——当前个位数工具规模下整链休眠，
    # 对主流程零开销；工具规模化后自动武装，无需改代码。本地想提前体验把阈值调到 4 以下即可。
    routing-handlers: wattai   # 逗号分隔按序尝试；当前支持 wattai（jev/本地语义路由为预留扩展位）；置空 = 不路由
    routing-tool-count-threshold: 20
    # 工具路由决策模型（可选）。api-key 为空时该节点不装配，责任链直接回落全量工具；
    # 鉴权/地址类 4xx 会停用节点，临时错误（超时、5xx、429）只弃权本次。
    wattai:
      base-url: ${WATTAI_BASE_URL:https://api.wattai.dev}
      api-key: ${WATTAI_API_KEY:}
      min-tools: 4
      confidence-threshold: 0.6
      top-k: 2
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
  # 知识库 RAG（docs/architecture/KNOWLEDGE-RAG.md）：不配置 EMBEDDING_API_KEY 时整个模块不启动，
  # 工具不注册、不连 Postgres，平台其余功能与 mvn test 均不受影响。
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:true}
    directory: ${KNOWLEDGE_DIR:knowledge}
    vector-store-url: ${KNOWLEDGE_DB_URL:jdbc:postgresql://localhost:5433/knowledge}
    vector-store-username: ${KNOWLEDGE_DB_USERNAME:postgres}
    vector-store-password: ${KNOWLEDGE_DB_PASSWORD:postgres}
    embedding-base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    embedding-dimensions: 1024
    # 外部 embedding 必须有超时与重试：供应商无响应会同时拖住索引线程与在线检索。
    embedding-connect-timeout-ms: ${EMBEDDING_CONNECT_TIMEOUT_MS:3000}
    embedding-read-timeout-ms: ${EMBEDDING_READ_TIMEOUT_MS:20000}
    embedding-max-attempts: ${EMBEDDING_MAX_ATTEMPTS:3}
    embedding-retry-initial-backoff-ms: 500
    embedding-retry-multiplier: 2.0
    embedding-retry-max-backoff-ms: 5000
    top-k: 4
    top-k-max: 8
    score-threshold: 0.30
    # 向量检索为空时用 ILIKE 回查 chunk 表，覆盖制度编号/专有名词这类查询。
    keyword-fallback-enabled: true
    max-chars: 800
    min-chars: 50
    overlap-chars: 100
    # 文档间主动节流（毫秒），首灌大量文档时避免打爆供应商配额；0 表示不限。
    index-delay-ms: ${KNOWLEDGE_INDEX_DELAY_MS:0}
    # 超过该时长仍为 RUNNING 的任务视为进程中断，下次触发时清理。
    job-timeout-minutes: 120
    # 检索审计留存天数；0 表示永久保留。
    audit-retention-days: 180
    # 固定评估题库（jsonl），POST /admin/knowledge/eval 使用。
    eval-file: ${KNOWLEDGE_EVAL_FILE:knowledge/eval/questions.jsonl}

management:
  # Actuator 不与业务共用 8000：管理端口默认只监听容器内网，compose 不发布它。
  # 需要抓取 prometheus 时由监控侧经内网访问，或另行加认证后再对外。
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        # prometheus 指标里含接口路径与调用量，只在管理端口可达
        include: health,prometheus
  endpoint:
    health:
      # 不向任意可达方披露数据库、磁盘等组件细节；排障看日志或本地开启
      show-details: never
